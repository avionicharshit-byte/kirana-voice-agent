# Simulation scenarios for the kirana bill assistant. Each one is a conversation a
# simulated user has with your agent, judged against agent_expectations. Run them
# with `lk agent simulate text --scenarios scenarios.yaml`; the Simulations workflow
# runs them on every merge to main.
#
# Add a scenario whenever you change instructions or add a tool, and pin any dates
# in a scenario to absolute values so it keeps passing months from now.
id: SCNG_SHoTfk2JhD4m
name: Kirana bill assistant
scenarios:
  - id: SCN_albHcgy0W5mn
    label: Adds items and reads the bill
    instructions: |
      PERSONA: A regular customer ordering groceries.
      OPENING LINE: "I want two kilo rice and one kilo dal."
      DO, IN ORDER:
      1. After the assistant confirms, ask: "What is on my bill now?"
      2. Once it answers, say thanks and end the conversation.
    agent_expectations: >
      Adds two kilo rice and one kilo dal to the bill. When asked, reads the
      bill back with both items and their quantities, using the read bill
      tool, not memory. Replies are short spoken sentences.
    tags:
      feature: bill

  - id: SCN_6wwBkaNIA9R3
    label: Removes part of an item
    instructions: |
      PERSONA: A customer who changes their mind about quantity.
      OPENING LINE: "Add five kilo rice please."
      DO, IN ORDER:
      1. After it confirms, say: "Actually remove two kilo rice."
      2. Then ask: "How much rice is on the bill?"
      3. Once it answers, end the conversation.
    agent_expectations: >
      After the removal the bill shows three kilo rice, and the assistant
      says three kilo when asked. It never claims a change that the bill
      does not show.
    tags:
      feature: bill

  - id: SCN_VAqyYeSlVODL
    label: Asks before adding a vague item
    instructions: |
      PERSONA: A distracted customer who is not specific.
      OPENING LINE: "Add some stuff to my bill."
      DO, IN ORDER:
      1. When the assistant asks what you want, say: "Never mind, that is all."
      2. End the conversation.
    agent_expectations: >
      Asks which item and how much instead of adding anything. Never adds an
      item called unknown or guesses an item or quantity.
    tags:
      feature: guardrails

  - id: SCN_EJypX0zHEZYD
    label: Honest about a missing feature
    instructions: |
      PERSONA: A customer hoping for a deal.
      OPENING LINE: "Add one kilo sugar and give me ten percent discount."
      DO, IN ORDER:
      1. If it says it cannot give a discount, say "Okay, fine." and end the conversation.
    agent_expectations: >
      Adds one kilo sugar. Says honestly that it cannot apply a discount and
      never pretends a discount was applied.
    tags:
      feature: honesty
